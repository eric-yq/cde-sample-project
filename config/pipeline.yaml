# Pipeline configuration — single source of truth.
#
# This file is read at CDK synth time and its values are injected into each
# Lambda as environment variables. It is also used by the local test harness and
# evaluation script. Retuning thresholds or adding a language requires editing
# ONLY this file — no business-logic code changes (see README "Extending").

# The shopper language reviews are translated into.
target_language: en

# Source languages the pipeline accepts. Add a new code here to extend coverage;
# Amazon Translate must support the source -> target pair.
supported_languages:
  - fr
  - de

bedrock:
  # Configurable Claude model id. Confirm it is enabled in the target account's
  # Bedrock model access before deploying. Swap without code changes.
  model_id: anthropic.claude-3-haiku-20240307-v1:0
  max_tokens: 300
  temperature: 0.2

thresholds:
  # Minimum composite translation score (0.0-1.0) to pass the translation gate.
  translation_score: 0.70
  # Minimum model self-assessed summary scores (0.0-1.0).
  fluency: 0.80
  factual_consistency: 0.80
  # Summary hard limits.
  max_summary_chars: 320
  # Acceptable translated/source length ratio band (catches truncation/runaway).
  length_ratio_min: 0.5
  length_ratio_max: 2.0

# Weights for the deterministic translation score components (must sum to 1.0).
scoring_weights:
  length: 0.3
  back_translation: 0.7

retries:
  max_attempts: 3
  base_delay_seconds: 2
